name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    # The official Python images keep 3.8 available after setup-python
    # dropped it from current Ubuntu runners.
    container: python:${{ matrix.python-version }}-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: python -m pip install greenlet
      - name: Byte-compile host code
        run: python -m compileall -q klippy scripts web
      - name: Unit tests (no hardware)
        run: python -m unittest discover -s tests -v
